<figcaption><p>Axial proton-density fat-saturated MR images of two different knees that showed reversibility at 6-month follow-up (MRI 3) in the extent of subchondral bone marrow oedema-like signal of the patella that previously developed from the pre-marathon scan to the 2 weeks post-marathon scan (MRI 1 to MRI 2): A) reversibility but not to the MRI 1 grading status, in the right knee of a 31-year old woman; B) complete resolution to the MRI 1 grading status, in the left knee of a 34-year-old woman. Bone marrow oedema-like signal is indicated by arrows and the lesion grade (G) is included in the left bottom corner and is defined in the KOSS scoring system [<a aria-describedby="CR18" class="usa-link" href="#CR18">18</a>] (see Table <a class="usa-link" href="#Tab2">2</a>); KOSS, Knee Osteoarthritis Scoring System</p></figcaption></figure>
